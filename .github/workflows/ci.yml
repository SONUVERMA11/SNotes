name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libinput-dev \
            libsqlite3-dev \
            pkg-config \
            clang \
            cmake \
            libfontconfig-dev \
            libfreetype6-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check (no default features)
        run: cargo check -p snotes-core --no-default-features

      - name: Check (all features)
        run: cargo check -p snotes-core --features full

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libinput-dev \
            libsqlite3-dev \
            pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (core, no default features)
        run: cargo test -p snotes-core --no-default-features

      - name: Run tests (core, with storage)
        run: cargo test -p snotes-core --features storage

      - name: Run tests (CLI)
        run: cargo test -p snotes-cli

      - name: Run tests (plugin)
        run: cargo test -p snotes-plugin

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libinput-dev \
            libsqlite3-dev \
            pkg-config \
            clang

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p snotes-gtk -p snotes-cli -p snotes-sync

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snotes-linux-x86_64
          path: |
            target/release/snotes-gtk
            target/release/snotes-cli
            target/release/snotes-sync

  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Sdk//46 org.gnome.Platform//46

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean build-dir flatpak/org.snotes.App.json

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: snotes-flatpak
          path: build-dir/
