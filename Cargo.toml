[workspace]
resolver = "2"
members = [
    "crates/snotes-core",
    "crates/snotes-gtk",
    "crates/snotes-sync",
    "crates/snotes-cli",
    "crates/snotes-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sonu Verma <https://github.com/SONUVERMA11>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/SONUVERMA11/SNotes"
homepage = "https://github.com/SONUVERMA11"
description = "Linux-native handwriting & annotation app"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Math & Geometry
nalgebra = "0.33"
euclid = "0.22"

# Input
input = "0.9"

# Rendering
skia-safe = "0.80"
cairo-rs = { version = "0.20", features = ["v1_16"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
flatbuffers = "24.3"
lz4_flex = "0.11"

# GTK
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"

# Async
tokio = { version = "1.0", features = ["full"] }
async-channel = "2.0"

# Sync
reqwest = { version = "0.12", features = ["json"] }
zbus = "5.0"
notify = "7.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Plugin
wasmtime = "25.0"

# PDF
lopdf = "0.34"
printpdf = "0.7"
pdf = "0.9"

# Image
image = "0.25"
resvg = "0.44"

# snotes internal
snotes-core = { path = "crates/snotes-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
